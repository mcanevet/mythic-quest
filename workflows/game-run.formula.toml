formula = "game-run"
description = "Multi-loop game build: genesis → grooming → dev (poppy) → QA (rachel) → vision (ian) → consumer (pootie) → release"
version = 1
type = "workflow"

[vars.skip_consumer_loop]
description = "Skip consumer-gate phase for comparability with older runs (benchmark parity flag)"
required = false
default = false

[vars.game_title]
description = "Title of the game being built"
required = true

# Phase 0: Genesis (creative)
[[steps]]
id = "genesis"
title = "Invent {{game_title}} concept"
type = "task"
assignee = "ian"
description = "Invent game concept (assignee: ian, dispatched by the orchestrator — the worker claims and closes as ian). Spawn raw task children under 'raw-backlog' container (no assignment or skill routing yet)."

[[steps]]
id = "raw-backlog"
title = "Raw backlog (unassigned)"
type = "task"
needs = ["genesis"]
assignee = "build"
description = "Container for raw task beads from genesis. Pending grooming."

# Phase 1: Backlog Grooming (build decides routing)
[[steps]]
id = "backlog-grooming"
title = "Groom backlog: assign roles, skills, priorities"
type = "task"
needs = ["raw-backlog"]
assignee = "build"
description = "For each raw child: (1) decide assignee (poppy/rachel/ian/pootie), (2) select skill (create-entity, create-ui, etc.), (3) set priority, (4) REPARENT the child to the dev-loop step so gates with waits_for=all-children can see it. Routing lands in ONE 'bd batch' transaction (assignee waves); the skill name rides the dispatch prompt, and reparenting is the only per-bead 'bd update'."

# Phase 2: Implementation Loop (poppy)
[[steps]]
id = "dev-loop"
title = "Implement features"
type = "task"
needs = ["backlog-grooming", "qa-repair-grooming", "vision-repair-grooming", "consumer-repair-grooming"]
assignee = "poppy"
waits_for = "all-children"
description = "Poppy claims beads assigned to poppy. Each bead dispatch includes 'Use skill: <skill-name>'. Inline playtest verification via MCP runtime. Discoveries spawn children here. Dispatch discipline (2-bead cap, batched grooming via 'bd batch', frontier pull via 'bd ready --mol'/'bd swarm status', concurrent dispatch on disjoint files, verbatim ID copying) lives authoritatively in the build profile."

# Phase 3: QA Gate (rachel)
[[steps]]
id = "qa-gate"
title = "QA signoff (Rachel)"
type = "task"
needs = ["dev-loop"]
waits_for = "all-children"
assignee = "rachel"
description = "Rachel verifies all dev children via MCP runtime. Discovers UNASSIGNED bugs as children of qa-gate (--parent); grooming routes, dev fixes. Gate closes only when all children PASS."

[steps.gate]
type = "human"
id = "rachel-qa-signoff"
description = "Rachel must run 'bd gate resolve' after all qa-gate children are closed PASS."

# Phase 3.5: QA Repair Grooming (build routes discovered bugs back to dev)
[[steps]]
id = "qa-repair-grooming"
title = "Route QA-discovered bugs to dev"
type = "task"
needs = ["qa-gate"]
assignee = "build"
description = "After QA closes, reparent any bug children found by QA under dev-loop, assign to poppy (or appropriate agent), and set priority. This re-opens dev-loop for the repair wave."

# Phase 4: Vision Validation (ian)
[[steps]]
id = "vision-gate"
title = "Vision validation (Ian)"
type = "task"
needs = ["qa-repair-grooming"]  # After QA repair, or directly after qa-gate if no bugs
waits_for = "all-children"
assignee = "ian"
description = "Ian validates against VISION.md. Writes critiques and discovers UNASSIGNED misalignment bugs as children. Gate closes only when clean."

[steps.gate]
type = "human"
id = "ian-vision-review"
description = "Ian must run 'bd gate resolve' after validation."

# Phase 4.5: Vision Repair Grooming (build routes discovered bugs back to dev)
[[steps]]
id = "vision-repair-grooming"
title = "Route vision-discovered bugs to dev"
type = "task"
needs = ["vision-gate"]
assignee = "build"
description = "After vision closes, reparent any bug children found by vision under dev-loop, assign to appropriate agent, and set priority. This re-opens dev-loop for the repair wave."

# Phase 5: Consumer Critique (pootie)
[[steps]]
id = "consumer-gate"
title = "Consumer acceptance (Pootie)"
type = "task"
needs = ["vision-repair-grooming"]  # After vision repair, or directly after vision-gate if no bugs
waits_for = "all-children"
assignee = "pootie"
description = "Pootie experiences game via MCP (screenshots, input sim), writes critique and discovers UNASSIGNED improvement bugs. Must actually play via engine MCP — code-blind critique is NOT acceptable (if engine tools are unavailable, report ⛔ BLOCKED; see walkthrough8 postmortem). Gating routes; dev fixes."
condition = "skip_consumer_loop == false"

[steps.gate]
type = "human"
id = "pootie-consumer-acceptance"
description = "Pootie must run 'bd gate resolve' after critique."

# Phase 5.5: Consumer Repair Grooming (build routes discovered bugs back to dev)
[[steps]]
id = "consumer-repair-grooming"
title = "Route consumer-discovered bugs to dev"
type = "task"
needs = ["consumer-gate"]
assignee = "build"
description = "After consumer closes, reparent any bug children found by consumer under dev-loop, assign to appropriate agent, and set priority. This re-opens dev-loop for the final repair wave."

# Phase 6: Release
[[steps]]
id = "release"
title = "Release {{game_title}}"
type = "task"
needs = ["consumer-gate", "vision-gate"]
assignee = "build"
description = "Final validation, clean reimport, stable run. Ship. (vision-gate in needs makes release reachable both when the consumer loop runs and when skip_consumer_loop=true — the consumer-gate need is conditional and vanishes with the step.)"
