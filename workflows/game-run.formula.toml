formula = "game-run"
description = "Cross-milestone glue for a convergent milestone build: backlog intake, standing grooming loop, post-release consumer critique. Milestones themselves (epic + gates + release) come from workflows/milestone-template.formula.toml, poured once per milestone at runtime — their count is unknowable at pour time."
version = 2
type = "workflow"

[vars.game_title]
description = "Title of the game being built"
required = true

# ── Milestone anatomy: workflows/milestone-template.formula.toml ──────────────
# At run start, pour the game-run molecule, then bond milestone 0 from the
# template as a parallel child (not a separate pour). Bonding attaches the
# milestone subtree to the same molecule root so `bd ready --mol` and
# `bd swarm status` see everything. The consumer gate is wired to the
# release by the bonding step; no manual dep add needed:
#
#   bd mol pour game-run --var game_title="<title>"
#   bd mol bond milestone-template <game-run-root-id> --type parallel \
#     --var theme="MVP" --var index=0
#   bd dep add <consumer-gate> <release-MVP>          # post-release critique
#   (release ID comes from the bond's spawn output / bd list)
#
# Later milestones are the SAME bond command with incremented index.
# Sequential gating (milestone N+1 after release N) is optional — for
# content milestones parallel is usually fine; for strict sequencing,
# dep-add the new milestone's release to the previous release.

[[steps]]
id = "raw-backlog"
title = "Raw backlog (unassigned)"
type = "task"
assignee = "build"
description = "Container for raw task beads from genesis, pending grooming. Grooming reparents each child into the current milestone and routes assignee + skill."

[[steps]]
id = "backlog-grooming"
title = "Groom backlog: assign roles, skills, priorities"
type = "task"
assignee = "build"
description = "Standing loop. For each unassigned bead (raw-backlog children, gate-discovered bugs, post-release consumer orphans): (1) choose milestone (current milestone, next milestone, defer), (2) assignee, (3) skill label, (4) priority, (5) REPARENT into the milestone. One 'bd batch' per wave; reparents are individual 'bd update --parent' calls (batch cannot reparent)."

# ── Post-release consumer critique ───────────────────────────────────────────
# The customer reviews the SHIPPED artifact, not WIP. The customer gate is
# NOT a child of any milestone (it must not block release), and the critiquer
# has no knowledge of internal structure: discovered beads are ORPHANS
# (no parent), triaged by the standing grooming loop into the next milestone
# or deferred. The consumer gate still needs one manual dep add after the
# bond (the bond wires the milestone, not the consumer):
#   bd dep add <consumer-gate> <release-MVP>          # post-release critique

[[steps]]
id = "consumer-gate"
title = "Consumer acceptance (Pootie)"
type = "human"
assignee = "pootie"
description = "Pootie experiences the RELEASED game via engine MCP (screenshots, input sim) — never a code-blind critique (if engine tools are unavailable, report ⛔ BLOCKED; walkthrough8 postmortem). Writes critique and creates UNASSIGNED ORPHAN beads (no --parent) — grooming triages them into the next milestone or defers. Must actually play via engine MCP."

[steps.gate]
type = "human"
id = "pootie-consumer-acceptance"
description = "Pootie runs 'bd gate resolve' after critique."
