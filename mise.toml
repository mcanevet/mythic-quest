# Pipeline-dev session toolchain.
# Everything a pipeline-dev session needs, versioned and reproducible.
# Install/activate with: mise install && mise exec -- <command> (or `mise shell`).
#
# Vocabulary (harness, pipeline-dev session, game-build session) is defined
# normatively in .agents/lint/rules.yaml.

[tools]
# Task tracking (beads) — single state layer for both session kinds
"github:gastownhall/beads" = "1.3.0-rc.2"
# Primary harness (agent execution environment) — pinned for reproducibility
opencode = "1.18.30"
