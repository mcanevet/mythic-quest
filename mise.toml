# Pipeline-dev session toolchain.
# Everything a pipeline-dev session needs, versioned and reproducible.
# Install/activate with: mise install && mise exec -- <command> (or `mise shell`).
#
# Vocabulary (see .agents/lint/rules.yaml):
# - harness: opencode / Claude Code / Codex ...
# - pipeline-dev session: developer session building this repo
# - game-build session: consumer session generating a game

[tools]
# Task tracking (beads) — single state layer for both session kinds
"github:gastownhall/beads" = "1.2.2"
# Primary harness (agent execution environment)
opencode = "latest"
