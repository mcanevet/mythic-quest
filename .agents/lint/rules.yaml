# Lint rules: single source of truth for repo governance.
# The linter covers all files in the repo. Do not restate rules elsewhere —
# other files (e.g. AGENTS.md) point here, they never copy rule text.
# To add or change a rule: edit this file, then run the lint to verify
# compliance (skills/lint wisp — see .agents/skills/lint/SKILL.md).
#
# Schema: each rule has a title, rationale, applies_to (file globs), and a
# prompt (injected verbatim into the judge subagent for each file).
# Paths in prompts are repo-relative from this repo's root: game-build
# surface dirs are agents/, skills/, plugins/, workflows/; pipeline
# internals live under .agents/.
#
# Vocabulary (normative):
# - harness: the agent execution environment (opencode, Claude Code, Codex, ...)
# - pipeline-dev session: developer session building this repo
# - game-build session: consumer session generating a game in a sandbox

version: 1

rules:
  prose-earns-place:
    title: Prose earns its place
    rationale: >
      Instruction prose must be load-bearing: every step, checklist entry,
      or caution prevents an observed failure, encodes non-obvious engine
      or tool behavior, or calibrates judgment. Noise costs context on
      every skill read; deterministic enforcement is evidence enough.
    applies_to: "**"
    prompt: >
      Identify prose blocks that describe step-by-step mechanical procedures,
      transforms, or deterministic operations (e.g. shell command sequences,
      file manipulation recipes, or algorithmic text transforms written as
      prose) — these belong in a script or dedicated artifact. Also flag
      content that is self-evident, derivable from tool schemas, or already
      enforced structurally by permissions, scripts, or the harness. Only
      flag actual mechanical procedures and free-floating noise; do not flag
      decision logic, rationale, observed-failure cautions, or calibration
      knowledge a new model would lack.

  least-privilege-permissions:
    title: Permission grants cite their justification
    rationale: >
      Every permission allow-grant in agent configs must cite the bead or
      benchmark run that justifies it, keeping the surface minimal and
      auditable. Unjustified grants are presumptively too broad.
    applies_to: "agents/**, plugins/**, .opencode/**"
    prompt: >
      Files that are not agent profiles or permission configuration
      contain no permission grants — close with NO APPLICABLE RULES. For
      agent permission configurations (agents/*.md frontmatter, permission
      rules, allowed tools/commands in harness configs), check each
      allow-grant: does it cite its justification — a bead ID (bd-NNN or
      similar) or a benchmark run reference? Flag grants lacking citations,
      broader than their cited justification warrants, or accumulating with
      no justification. Read-only tools (read, glob, grep, todowrite,
      question) don't need narrowing — the principle bites on mutating
      tools (edit, write, bash) and MCP write patterns.

  single-source-of-truth:
    title: No restatement across files
    rationale: >
      Rules, conventions, and permission profiles live in exactly one place.
      Generated sections in other files originate from a render source,
      never hand-edited.
    applies_to: "**"
    prompt: >
      Look for the same rules, conventions, or configuration restated in
      multiple files, where one copy can drift from the others. Generated
      sections (delimited by BEGIN/END markers naming their source) are fine
      — restatements outside such generated blocks are violations. Flag
      hand-edited-looking copies of content that should be generated or
      centralized, and any generated block whose source of truth is unclear.

  engine-agnostic-agents:
    title: Agent decision logic is engine-agnostic
    rationale: >
      Agents are portable across engines; skills carry the engine specifics.
      Engine API names, file formats, MCP tool names, or process management
      in agent instruction text break that portability boundary.
    applies_to: "agents/**"
    prompt: >
      In agent instruction text (not frontmatter permissions — those are
      configuration), flag engine-specific content: engine API names (e.g.
      Godot node types, .tscn files), MCP tool names, or process
      management commands. References to skills for implementation details
      are legal; that IS the portability mechanism. Implementation patterns
      belong in skills (plugins/engine/*/skills/), not agents — if a rule
      would survive an engine switch it is decision logic (agent); if it
      names APIs/files/tools it is implementation (skill).

  grant-scope-proportionality:
    title: Bash grant scope matches its justification
    rationale: >
      Incident-driven permission patches justify broad grants with a
      citation but nothing revisits scope: 'git -C *' was justified by a
      worktree-commit incident yet reached any repo/remote (wt16 96om).
      Scope breadth must match the incident that earned it.
    applies_to: "agents/**"
    prompt: >
      In frontmatter bash permission grants, flag allows whose pattern is
      materially broader than the cited justification requires. Specific
      red flags: 'git -C *' (unscoped directory reach) where the comment
      cites a worktree or specific-path incident; 'git push*' or
      'git config*' anywhere; command wildcards covering subcommands the
      comment does not mention. Grants already scoped (e.g.
      'git -C worktrees/*', 'git status*', 'git diff*') are proportional
      when the comment names their purpose. Only flag real breadth-
      beyond-need; do not demand narrowing read-only commands.

  no-improvised-alternatives:
    title: Sanctioned paths only — no improvised alternatives
    rationale: >
      Where a skill defines one sanctioned path, the correct outcome on
      failure is a structured BLOCKED report, not a detour. Work done
      outside the sanctioned path is not done.
    applies_to: "agents/**, plugins/**, skills/**"
    prompt: >
      Flag instruction text offering fallback, alternative, or "last
      resort" paths where a skill defines one sanctioned path. Wording red
      flags: "if X fails, you can alternatively…", "or fall back to…",
      "as a last resort, manually…". Legal: prohibition lines ("never
      fall back"), domain splits with stated reasons, scoped degradation
      with stated reason, and the structured BLOCKED escape hatch itself.
      Permission-level exceptions in frontmatter are the only sanctioned
      divergence and require observed evidence.

  genre-agnostic-content:
    title: Genre-agnostic skills and agents
    rationale: >
      Game-build content must work for any genre — puzzle, action,
      strategy, simulation alike. Genre assumptions baked into skills or
      agents silently break other games.
    applies_to: "agents/**, plugins/**, skills/**"
    prompt: >
      Judge the assumption, not the vocabulary: a skill assuming a "jump
      arc" or "respawn timer" is a violation; a frame-time budget is not.
      Citing a genre only as a worked example ("e.g. a platformer") is
      legal; assuming the genre in decision logic is not. Named games and
      cultural commentary are violations; incident anecdotes naming genre
      objects as observed evidence are legal.

  agent-agnostic-skills:
    title: Skills are agent-agnostic
    rationale: >
      Any agent can execute any skill; role judgment is applied by the
      agent, not encoded in the skill. Persona voice, role rubrics, or
      inter-agent choreography in skills couples the two wrongly.
    applies_to: "plugins/**, skills/**"
    prompt: >
      Flag agent names (e.g. Poppy, Ian, Pootie, Rachel) or role-specific
      judgment in skills ("Poppy should…", "the Lead Engineer ensures…"),
      including paraphrases. Also flag persona voice, evaluation rubrics
      belonging to a specific role, or collaboration patterns tied to one
      agent. Generic pronouns are fine.

  encode-real-failures:
    title: Encode observed failures as checks
    rationale: >
      Observed playtest/validation failures must become a gotcha line or
      validator check, or they recur. A rule that exists because of an
      incident beats a rule invented from theory.
    applies_to: "plugins/**, skills/**"
    prompt: >
      This rule evaluates rule QUALITY rather than flagging violations:
      note (do not flag) content that encodes a real observed failure.
      Prefer stating the causal mechanism of the failure over bare incident
      references; a mechanism-stated rule is reusable across runs and
      engines. Flag instruction text that asserts failure modes with no
      observed basis where the claim is non-obvious — either state the
      mechanism or drop the claim.

  failure-mechanism-stated:
    title: Gotchas state the mechanism of failure
    rationale: >
      For model-maintained repos, the causal mechanism is the knowledge
      transfer; bare dates or citations carry no information for the model
      and encourage hoarding of transient evidence. A rule that explains
      *why* something fails is reusable; a rule that only says *when* it
      failed is cargo-cult.
    applies_to: "plugins/**, skills/**"
    prompt: >
      In gotchas, cautions, and failure protocols, flag assertions that
      describe a failure mode without stating its causal mechanism
      (e.g. "observed 2026-09-04" or "run 3" without explaining *why* it
      fails). Legal: mechanism-stated rules with optional bare-date
      grounding ("Godot's parser rejects hex strings — observed 2026-09-04").
      Illegal: bare dates with no mechanism ("fail with hex strings —
      observed 2026-09-04"). When the mechanism is obvious/engine-standard
      (e.g. "pkill kills the MCP server"), a bare statement suffices.

  no-pkill:
    title: No pkill usage or instruction
    rationale: >
      Broad pkill patterns match the MCP server's command line and kill
      it, permanently removing all engine tools for the session. The
      sanctioned engine stop is the stop_engine.sh helper.
    applies_to: "agents/**, plugins/**, skills/**"
    prompt: >
      Flag any pkill usage or instruction to use pkill (including
      "pkill -f" variants) except in the sanctioned stop-engine script
      itself and in prohibition lines that document the ban ("Never run
      pkill", "the only sanctioned engine stop"). If an engine stop is
      needed, the reference should point to the stop_engine helper script.

  benchmark-objective-triad:
    title: Benchmark decisions optimize the objective triad
    rationale: >
      Harness evaluation and benchmark-record decisions optimize a
      three-part objective, strictly ordered: (1) OUTCOME — the game works
      per the vision; (2) SPEED — wall clock; (3) TOKEN EFFICIENCY.
      Lexicographic, not weighted: a faster or cheaper run that ships a
      broken game is a regression.
    applies_to: "agents/**, plugins/**, skills/**, benchmarks/**"
    prompt: >
      In benchmark reports, run comparisons, and evaluation instructions,
      flag conclusions drawn without stating results on the three ordered
      axes (outcome quality, wall clock, token totals), or any framing
      that treats speed or cost savings as acceptable trades against a
      broken or vision-missing shipped game.

  incident-narrative-minimalism:
    title: Incidents are protocol, not narrative
    rationale: >
      Incident knowledge in harness documents is recorded as signature,
      deployed protocol, one-sentence root cause, and evidence citations —
      not as timeline storytelling that costs context and rots.
    applies_to: "plugins/**, skills/**, agents/**, benchmarks/results/**"
    prompt: >
      In documentation of run incidents (stalls, wedges, crashes, denial
      storms), flag timeline reconstructions, hour-by-hour archaeology,
      event-narration chains ("first X then Y then Z"), incidental host
      forensics beyond a one-line root cause, and speculation about
      process internals presented as cause. Legal: the failure SIGNATURE,
      the deployed PROTOCOL, a one-sentence verified root cause, observed
      metric rows, and one sentence of incident grounding.

  config-not-hardcoded:
    title: Game-specific values are config, not hardcoded
    rationale: >
      Input action names, node paths, bounds, and thresholds hardcoded
      into harness scripts or skill docs assume one game's conventions —
      the next genre breaks silently. Discover dynamically or require
      explicit config.
    applies_to: "plugins/**, skills/**"
    prompt: >
      In scripts and embedded code blocks of skill docs, flag
      game-specific values treated as constants where they vary per game:
      input action names, node paths, scores, bounds, durations, movement
      speeds. Legal: engine-protocol actions that ARE the domain
      (the meta-action keys of a bot config), engine-agnostic parameter
      names with values supplied by callers, and convention FALLBACKS
      that can be overridden by explicit config (e.g. trying "move_up"
      then "up" then "ui_up" when no actions override is given) — a
      hardcoded-only path with no override is the violation.

  upstream-lifecycle-status:
    title: Upstream workarounds cite status and retirement
    rationale: >
      Workarounds for upstream dependency gaps (engine, MCP runtime,
      bridge safety policies) without a filed/patched/released status and
      a retirement condition rot into permanent cargo cult.
    applies_to: "plugins/**, skills/**, agents/**"
    prompt: >
      Flag workaround instructions targeting an upstream dependency
      (version pins to dodge a bug, restrictions imposed by a bridge
      safety policy, manual steps compensating for a missing tool
      feature) that lack (a) upstream lifecycle status — filed, patched,
      released, or pinned-version note — and (b) a retirement condition
      ("remove when >= vX.Y"). Do not judge whether the fix actually
      shipped; only whether the file records enough to check later.

  trigger-quality:
    title: Skill descriptions state what AND when
    rationale: >
      SKILL.md descriptions drive skill selection by agents that never
      read the body. A vague description ("helps with scenes") means the
      skill is chosen wrongly or never.
    applies_to: "plugins/*/skills/*/SKILL.md, skills/*/SKILL.md"
    prompt: >
      Judge the frontmatter description of this SKILL.md: does it state
      WHAT the skill does AND WHEN to use it, specifically enough that an
      agent choosing between sibling skills picks correctly? Flag vague
      descriptions ("helps with scenes", "for quality") and descriptions
      that omit the trigger conditions. Files that are not SKILL.md close
      with NO APPLICABLE RULES.

  progressive-disclosure:
    title: SKILL.md stays lean; detail lives in reference/
    rationale: >
      SKILL.md is read in full on every skill load — it must stay under
      ~500 lines with detail in reference/ docs. Duplicated content
      between SKILL.md and reference/ drifts apart.
    applies_to: "plugins/*/skills/*/SKILL.md, skills/*/SKILL.md"
    prompt: >
      If this file is a SKILL.md: flag if it exceeds ~500 lines, or if
      substantial content (more than short ≤3-line summaries) is
      duplicated between it and its reference/ docs. Detail belongs in
      reference/; SKILL.md keeps decision logic and pointers. Files that
      are not SKILL.md close with NO APPLICABLE RULES.

  bd-verb-surface:
    title: Allowed bd verbs match agent duties
    rationale: >
      When an agent's bash permissions allow bd commands, the allowed
      verb set must match its documented ledger duties — no more.
      Gate authority model: each specialist (QA, vision, consumer critic)
      RESOLVES ITS OWN gate — the verdict owner closes the gate so the
      orchestrator cannot forge it (deployed design, wt-formula
      [steps.gate]; orchestrator holds `bd gate check` only). What QA
      profiles must NOT do: close OTHER specialists' gates, resolve
      release beads, or claim implementation task beads. Implementer
      profiles may claim, close, and file discovered work; the
      orchestrator dispatches and grooms but never claims task beads
      and never forges specialist verdicts.
    applies_to: "agents/**"
    prompt: >
      For agent profiles with bd command grants in frontmatter, check
      each allowed verb against the agent's documented duties and the
      gate-authority model: specialists (rachel/ian/pootie) MAY close
      and resolve their OWN gate beads (verdict ownership) but must
      not claim implementation task beads or resolve gates owned by
      other specialists; implementer/solo profiles may claim, close,
      and file discovered work; the orchestrator may read, groom,
      reclaim, and run `bd gate check`, but must not claim task beads
      or resolve specialist gates. Flag verbs granted beyond the
      profile's duties under this model. Convention: verbs outside
      the profile are left UNSET (denied by the catch-all) rather than
      explicitly denied one by one — explicit per-verb denies are
      noise, not violations. Files without bd grants close with NO
      APPLICABLE RULES.

  executable-instructions:
    title: Instructions are executable by their addressee
    rationale: >
      An instruction that requires a capability its addressee lacks
      (tools denied by frontmatter, actions only a human or another
      process can perform) is dead prose: it is either ignored — eroding
      trust in every other instruction — or produces improvised
      workarounds. Observed: an orchestrator with deny-all bash except
      bd verbs was told to "check the session DB" (pipeline-dev repo
      audit, 2026-09-18, wisp mythic-quest-wisp-7sh6).
    applies_to: "agents/**, plugins/**, skills/**"
    prompt: >
      For each imperative instruction in the file, check that the
      addressee (the agent this profile/skill addresses) can execute it
      with the capabilities it plausibly holds — cross-reference the
      file's own frontmatter permission denies where present. Flag:
      (a) instructions requiring tools or commands the same file's
      frontmatter denies or omits; (b) instructions to observe state
      only a human or the host harness can observe (e.g. querying
      databases outside the project, reading another process's logs),
      unless the instruction explicitly says "report to the human".
      Timed/clock-based instructions ("every ~2 minutes", "wait one
      hour") addressed to synchronous agents are also violations —
      agents act turn-by-turn, so cadence must be expressed as
      "between dispatches" or "per iteration". Legal: instructions
      conditional on tool availability ("if you cannot X, report
      BLOCKED").

  no-dead-fallback-paths:
    title: Degraded-mode paths are reachable or deleted
    rationale: >
      Fallback and degraded-mode branches that other standing rules
      make unreachable are dead weight and drift-bait: they read as a
      sanctioned option an agent may never lawfully take. Observed:
      a QA profile gained "static review acceptable when the
      orchestrator acknowledges degraded mode" while the orchestrator
      profile simultaneously banned offering degraded mode — an
      unreachable branch (pipeline-dev repo audit, 2026-09-18 — fixed
      same day, bead mythic-quest-hg9).
    applies_to: "agents/**, plugins/**, skills/**"
    prompt: >
      Flag instructions that authorize a degraded, fallback, or
      exception mode gated on a condition another instruction
      (in this file or a referenced counterpart — e.g. an orchestrator
      profile paired with a specialist profile) forbids the counterparty
      from triggering. Also flag exception paths whose triggering
      condition names an actor that can never meet it ("when the human
      approves X" inside a flow the human never sees). Do NOT flag the
      structured BLOCKED escape hatch (report-and-stop is always
      reachable), nor domain splits with stated reasons. When uncertain
      whether the counterpart file forbids the trigger, note it as a
      question rather than a violation.

  proportionate-protocol:
    title: Failure protocols are proportionate to their evidence
    rationale: >
      Defensive machinery must scale with observed recurrence: a
      single-incident failure earns a one-line rule plus escalation,
      not a multi-branch diagnostic tree. Over-calibrated protocols
      (distinct causal diagnoses for one symptom, multi-clause
      reporting requirements, repeated restatements of the same
      requirement) cost context on every read and mislead when the
      assumed cause is wrong. Observed: a health-check contract demanded
      the agent distinguish server death from a toolset race — the
      actual cause was neither (broken npx package; see
      benchmarks/results/2026-09-17-walkthrough8-rallywall-lumomax.md
      and upstream dist fix commit ea75a0d).
    applies_to: "agents/**, plugins/**, skills/**"
    prompt: >
      Evaluate failure-handling and verification text for
      OVER-calibration: (a) instructions to diagnose or distinguish
      CAUSES of a failure (not just detect and report it) where the
      diagnosis could be wrong or belongs to the human — reporting the
      symptom and stopping is usually sufficient; (b) the same
      requirement restated multiple times within a file where one
      statement suffices (flag only exact-duplicate intent, not
      complementary aspects like probe-then-verify-then-close-report
      each saying something new); (c) multi-clause report templates
      (more than ~3 required elements) for routine failures. Legal:
      cause-distinguishing text where the file cites an observation
      that the distinction changed the correct ACTION (not just the
      wording), and layered contracts where each layer adds
      information. Note but do not flag: genuinely load-bearing
      repetition in a close-reason template vs its workflow step.

  no-bandaid-fixes:
    title: Fix causes, not symptoms
    rationale: >
      A workaround compensating for another repo surface's defect (e.g. a
      cleanup script for files a skill scaffolds to the wrong path) survives
      the source fix and becomes dead maintenance. When the upstream cause is
      fixable here, fix it there and delete the workaround. Observed: a
      cleanup_stale_files.sh helper was proposed for orphaned entity scenes
      while the real fix was one convention line in create-entity (wt11 run,
      2026-09-18, bead mythic-quest-m0u — helper withdrawn before birth).
    applies_to: "agents/**, plugins/**, skills/**"
    prompt: >
      Flag instructions, scripts, or permission grants that exist to
      compensate for a defect whose cause is fixable within this repo's own
      surfaces — especially when the compensating mechanism would (and
      should) become dead after the source fix. Red flags: cleanup helpers
      for artifacts a skill itself creates, permission grants legitimizing
      work made unnecessary by an available source fix, detection machinery
      for failures a convention change would prevent outright. Legal:
      workarounds for UPSTREAM dependencies (engine, MCP runtime) with
      lifecycle status and retirement conditions (see
      upstream-lifecycle-status), and post-hoc cleanup of transition-era
      orphans created BEFORE a fix landed. When uncertain whether the
      upstream cause is locally fixable, note it as a question rather than
      a violation.

  agent-frontmatter-schema:
    title: Agent markdown frontmatter matches the harness schema
    rationale: >
      Agent .md frontmatter validates against the harness (opencode)
      agent schema; unknown keys are NOT errors — they pass through to
      the model provider as options, so junk keys ship silently as
      provider params. `name` is not a frontmatter key in markdown agent
      files (identity derives from the filename); `color` is cosmetic
      noise this repo omits. Observed: four profiles carried
      `name: <role>` (silently forwarded to providers) and hex colors
      (pipeline-dev repo, 2026-09-18, commit preceding b7429fd).
    applies_to: "agents/**"
    prompt: >
      For agent markdown files, the frontmatter may contain ONLY these
      keys: description, mode (primary|subagent|all), model, variant,
      temperature, top_p, permission, disable, hidden, steps, options,
      and recognized passthrough model-option keys (e.g. reasoningEffort).
      Flag (a) any other key — especially `name` (derives from filename)
      or `color` (cosmetic; repo convention omits it); (b) a missing
      description (it drives Task-tool selection); (c) a missing mode —
      the repo convention sets it explicitly on every agent. Files that
      are not agent markdown close with NO APPLICABLE RULES.

  dispatch-as-bd-native:
    title: Orchestration instructions must use bd-native primitives, not bash loops
    rationale: >
      Dispatch loops hand-written in bash reimplement what bd (beads)
      provides natively: --assignee routing, ready detection, molecule
      completion. Observed in wt12/wt13 (2026-09-20): the build dispatcher
      emitted 16 `bd update --set-labels` and 16 `bd update --assignee`
      calls per run (~130s of serial bookkeeping) — the same routing
      could be declared once in the formula — and 96%/76% of its wall
      time sat blocked inside synchronous task awaits that
      fire-and-monitor dispatch (bd ready --mol polling) would overlap.
      Trace detection is codified in trace-watch lens E
      (orchestrator anti-patterns); this rule catches the static side:
      profiles and formulas that prescribe the loop pattern.
    applies_to: "agents/**, skills/**, workflows/**"
    prompt: >
      Flag orchestration instructions that prescribe bash-level dispatch
      loops where bd offers a native primitive. Red flags: per-bead
      `for ...; do bd update` loops for routing or labeling (should be
      formula-level pre-routing or a single wave operation); sleep-based
      or repeated identical `bd show/list/ready` polling (bd ready --mol
      IS the wait primitive); instructions telling a dispatcher to await
      each subagent synchronously before preparing the next dispatch when
      the dispatches are independent (fire-and-monitor: dispatch, then
      poll bd for readiness, overlapping preparation with child work).
      Legal: serial awaits where a true dependency chain exists (scaffold
      before entities), and one-off `bd update --assignee` calls for
      repairs or dynamic routing decisions. When a prescribed loop is
      dependency-justified, note it as legal rather than a violation.
