# Lint rules: single source of truth for repo governance.
# The linter covers all files in the repo. Do not restate rules elsewhere —
# other files (e.g. AGENTS.md) point here, they never copy rule text.
# To add or change a rule: edit this file, then run the lint to verify
# compliance.
#
# Vocabulary (normative):
# - harness: the agent execution environment (opencode, Claude Code, Codex, ...)
# - pipeline-dev session: developer session building the repo
# - game-build session: consumer session generating a game

version: 1

rules:
  prose-earns-place:
    title: Prose earns its place
    rationale: >
      Mechanical procedures buried in prose rot and drift. Agent and skill
      prose should contain decision logic, not procedures; procedures belong
      in a script or another dedicated artifact.
    applies_to: "**"
      prompt: >
        Identify prose blocks that describe step-by-step mechanical procedures,
        transforms, or deterministic operations (e.g. shell command sequences,
        file manipulation recipes, or algorithmic text transforms written as
        prose). These should be extracted into a script or dedicated artifact,
        not expressed as prose. Only flag actual mechanical procedures; do not
        flag decision logic, rationale, or high-level conceptual explanation.

  least-privilege-permissions:
    title: Permission grants cite their justification
    rationale: >
      Every permission allow-grant in agent configs must cite the bead or
      benchmark run that justifies it, keeping the surface minimal and
      auditable.
    applies_to: "**"
    prompt: >
      Files NOT matching *.json, *.jsonc, *.toml, *.yaml under the repo root
      (top two levels) contain no permission configuration — close with
      NO APPLICABLE RULES. For agent permission configurations (permission
      rules, allowed tools or commands in opencode.json, .opencode/, and
      similar harness configs), check each allow-grant: does it cite its
      justification — a bead ID (pattern like mythic-quest-XXX or bd-NNN) or
      a benchmark run reference? Flag grants that lack citations, are
      broader than their cited justification warrants, or accumulate
      permissions with no justification at all.

  single-source-of-truth:
    title: No restatement across files
    rationale: >
      Rules, conventions, and permission profiles live in exactly one place.
      Generated sections in other files originate from a render source,
      never hand-edited.
    applies_to: "**"
    prompt: >
      Look for the same rules, conventions, or configuration restated in
      multiple files, where one copy can drift from the others. Generated
      sections (delimited by BEGIN/END markers naming their source) are fine
      — restatements outside such generated blocks are violations. Flag
      hand-edited-looking copies of content that should be generated or
      centralized, and any generated block whose source of truth is unclear.
