name: godot
description: Godot engine plugin — provides game-build skills for Godot projects.
engine: godot
version: 1

# Requirements (documented for sandbox-init verification and session awareness):
requirements:
  binary:
    name: godot
    version: ">=4.2.0"
    note: "Install via mise or system package manager"
  mcp:
    name: godot-mcp-runtime
    version: ">=3.3.0"
    note: "Released version only — no local forks. MCP-driven scene editing requires this; file-based flows work without it."

skills:
  init-project:
    description: Scaffold Godot project files (project.godot, icon.svg, .gitignore)
  create-entity:
    description: Create Godot entity scenes + scripts (CharacterBody2D, RigidBody2D, Area2D)
  create-ui:
    description: Create Godot UI scenes (Control nodes, menus, HUD) — STUB
  create-level:
    description: Create full Godot level scenes — STUB
  playtest:
    description: Run game headless, verify scene integrity, close bead with verdict

# Sandbox-init uses this file to verify the engine exists and display info.
# The session discovers tool availability naturally (try the tool, get error).
