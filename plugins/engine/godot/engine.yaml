name: godot
description: Godot engine plugin — provides game-build skills for Godot projects.
engine: godot
version: 1

# Skills live in skills/ (descriptions in each SKILL.md frontmatter).
# MCP servers are declared in mcp.json (rendered into harness configs
# by sandbox-init). Session discovers tool availability naturally.

# Shared-file list (parallel-dispatch serialization): beads touching any of
# these files must be dispatched serially; disjoint roles may parallelize
# (evidence: 2026-09-15 walkthrough6 control run — the one deliberate
# parallel on disjoint files was clean, serialized same-file batches
# wasted ~30-40min, benchmarks/results/2026-09-15-walkthrough6-lumomax-control.md).
shared_files:
  - project.godot
  - scenes/main.tscn
  - scripts/main.gd
#
# Runtime lock: while any session holds a running project
# (run_project), scene-mutating tools (batch_scene_operations,
# set_node_properties on scenes) are refused. Parallel dispatch must
# not pair a scene-mutation bead with a run/verify bead — schedule
# them sequentially (evidence: wt9 2026-09-18, phil's batch ops
# refused twice during poppy's runtime session).
#
# Upstream lifecycle (mcp.json):
# - Pin `ea75a0d` on github.com/mcanevet/godot-mcp-runtime: combo branch
#   carrying the four tools added upstream as PRs #45–#47
#   (verify_node_connections, validate_scene_structure, click_ui_element)
#   plus check_health, WITH dist/ committed (ea75a0d) — the npm package
#   publishes bin → dist/index.js but gitignored dist, so
#   `npx git+...#combo/...` failed with 'command not found', silently
#   tool-less sessions (root cause of 09-17 walkthrough8's zero MCP
#   calls and a live sandbox BLOCKED reproduction; fixed by committing
#   the build output to the pin branch). Status: PRs filed/CI-green,
#   not yet merged into a tagged upstream release. Retirement: when a
#   tagged upstream release (>= v3.5) ships all four tools AND a
#   working npm package (dist present), re-pin to that tag.
# - GODOT_MCP_DISABLE_ELICITATION=true: bridges runtime elicitations that
#   stall headless agent sessions. Status: workaround for an upstream
#   behavior; retirement: remove when upstream makes non-interactive the
#   default for non-TTY sessions.
